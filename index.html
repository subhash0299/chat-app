<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minimal Chat</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div id="loginScreen" class="chat-container">
    <h2>Enter Password</h2>

    <input type="password" id="passwordInput" placeholder="Password">
    <label class="remember-box"> <input type="checkbox" id="rememberMe"> <span>Remember Me</span> </label>
    <button id="loginBtn">Enter</button>
  </div>

<div id="chatScreen" class="chat-container" style="display:none;">

  <h2>Minimal Chat</h2>

  <input
    type="text"
    id="name"
    placeholder="Your name"
  >

  <div class="room-controls">

    <button id="createRoomBtn">
      Create Room
    </button>

    <button id="joinRoomBtn">
      Join Room
    </button>

    <button id="deleteRoomBtn">
      Delete Room
    </button>

    <button
      id="exitRoomBtn"
      style="display:none;"
    >
      Exit Room
    </button>

  </div>

  <div id="roomArea">

    <h3 id="currentRoom">
      No room joined
    </h3>

    <div id="messages"></div>

    <div id="typingIndicator"></div>

    <div
      id="replyPreview"
      style="display:none;"
    >
      <div id="replyText"></div>

      <button id="cancelReply">
        ✕
      </button>
    </div>

    <button
      id="clearBtn"
      class="clear-btn"
    >
      Clear Chat
    </button>

    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Type message..."
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

</div>

  <script type="module" src="./app.js"></script>

</body>

</html>
